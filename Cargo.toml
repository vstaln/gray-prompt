[package]
name = "gray-prompt"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Layered prompt customization: global ~/.gray/prompt/custom.md + per-project .gray-prompt.md (port of pi's prompt-customizer)."

[[bin]]
name = "gray-prompt"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
